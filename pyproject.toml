[project]
name = "communications"
version = "15.8.1"
description = "Messaging and telephony extensions for Frappe"
authors = [
    { name = "AgriTheory", email = "support@agritheory.dev"}
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.urls]
homepage = "https://github.com/agritheory/communications"
repository = "https://github.com/agritheory/communications"
source = "https://github.com/agritheory/communications"
changelog = "https://github.com/agritheory/communications/CHANGELOG.md"
documentation = "https://github.com/agritheory/communications/tree/version-15/communications/docs"
issues = "https://github.com/agritheory/communications/issues"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.10"
slack-sdk = "^3.39.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.0.0"
pytest-order = "^1.2.1"
mypy = "^1.15.0"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"

[tool.bench.dev-dependencies]
mypy = "~=1.15.0"
pytest = "~=8.3.5"
pytest-cov = "~=6.0.0"
pytest-order = "~=1.2.1"

[tool.pytest.ini_options]
addopts = "-s --disable-warnings"

[tool.black]
line-length = 99

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    "communications/__init__.py:__version__"
]
build_command = "echo 1"

[tool.semantic_release.branches.version]
match = "version-(15|16)"

[tool.codespell]
skip = "CHANGELOG.md"
ignore-words-list = "notin,Greif"